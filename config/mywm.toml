# Neun globale Workspaces; Monitorzuordnung unten. Änderungen gelten nach Neustart.
workspaces = 9
# Outputs not listed here use tear-free VSync presentation.
async_outputs = ["DP-3"]
# Fenster mit Elternfenster (z. B. Dateidialoge) standardmäßig frei schwebend.
float_dialogs = true
# Workspace 3 liegt auf DP-3 (Hauptmonitor) und ist ausschließlich für Spiele reserviert.
# Spiele werden automatisch dorthin gelegt; andere Fenster können weder dort starten
# noch dorthin verschoben werden.
gaming_workspace = 3
game_app_id_prefixes = ["steam_app_", "gamescope"]
# Programm und Argumente getrennt, ohne Shell-Auswertung.
terminal = ["kitty"]
# Standard: $HOME/Bilder/Wallpaper. Muss ein absoluter Pfad sein.
# wallpaper_directory = "/home/nutzer/Bilder/Wallpaper"

# Optional: adaptive sync remains off except while a recognized game is visibly
# fullscreen on this output. command receives wlr-randr-compatible arguments.
[vrr]
enabled = false
output = "DP-3"
command = ["wlr-randr"]

[workspace_outputs]
DP-3 = [1, 2, 3]
HDMI-A-1 = [4, 5, 6]
DP-1 = [7, 8, 9]

# Sekunden; 0 deaktiviert den jeweiligen Inaktivitäts-Timer.
[idle]
lock_after_seconds = 300
monitor_off_after_seconds = 600

[keyboard]
layout = "de"
variant = ""
options = ""

[appearance]
gaps_inner = 4
gaps_outer = 4
border_width = 2
active_border = "#89b4fa"
inactive_border = "#45475a"
# Gemeinsame Palette für WM und Quickshell.
background = "#1e1e2e"
surface = "#313244"
text = "#cdd6f4"
muted_text = "#a6adc8"

[bindings]
reload = ["Super+Shift+r"]
wallpaper = ["Super+Shift+w"]
lock = ["Super+Escape"]
terminal = ["Super+Return"]
launcher = ["Super+Space"]
close = ["Super+q"]
exit = ["Super+m"]
toggle_floating = ["Super+v"]
# Globaler Floating-Stack: ein-/ausblenden bzw. Fenster hinein-/herausverschieben.
toggle_scratchpad = ["Super+grave"]
move_to_scratchpad = ["Super+Shift+grave"]
# Monitorfokus bzw. fokussiertes Fenster geometrisch zum Nachbarmonitor bewegen.
focus_output_left = ["Super+Alt+Left"]
focus_output_right = ["Super+Alt+Right"]
focus_output_up = ["Super+Alt+Up"]
focus_output_down = ["Super+Alt+Down"]
move_to_output_left = ["Super+Shift+Left"]
move_to_output_right = ["Super+Shift+Right"]
move_to_output_up = ["Super+Shift+Up"]
move_to_output_down = ["Super+Shift+Down"]
# Mit linker Maustaste Floating-Fenster verschieben; mit rechter Floating-Fenster
# oder gekachelte Spalten skalieren.
pointer_modifiers = "Super"
focus_left = ["Super+h", "Super+Left"]
focus_right = ["Super+l", "Super+Right"]
move_left = ["Super+Shift+h"]
move_right = ["Super+Shift+l"]
# Workspace auf dem aktuellen Monitor wechseln (zyklisch).
workspace_previous = ["Super+Ctrl+Left", "Super+Ctrl+Up"]
workspace_next = ["Super+Ctrl+Right", "Super+Ctrl+Down"]
# Fenster in den vorigen/nächsten Workspace des Monitors verschieben.
move_to_workspace_previous = ["Super+Ctrl+Shift+Up"]
move_to_workspace_next = ["Super+Ctrl+Shift+Down"]
# Zusammen mit den Ziffern 1 bis workspaces.
workspace_modifiers = "Super"
move_to_workspace_modifiers = "Super+Shift"

# Frei benannte Kürzel zum Starten beliebiger Programme.
[program_bindings.browser]
keys = ["Super+b"]
command = ["helium-browser"]

[program_bindings.file_manager]
keys = ["Super+e"]
command = ["thunar"]

# Regeln gelten beim ersten Einordnen eines Fensters, nicht bei späteren Änderungen.
# App-IDs werden beim Start einer Anwendung im mywm-Log ausgegeben.
# Alle angegebenen Selektoren müssen exakt passen; letzte Angabe je Eigenschaft gewinnt.
#
# [[rules]]
# app_id = "firefox"
# workspace = 2
#
# [[rules]]
# app_id = "org.gnome.Calculator"
# floating = true
#
[[rules]]
dialog = true
floating = true
